name: QuantumD CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: quantumd-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-package-demo:
    name: Test, package, and governed demo
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install source and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run source tests
        run: python -m pytest -q

      - name: Build distributions
        run: |
          rm -rf build dist src/*.egg-info
          python -m build
          python -m twine check dist/*

      - name: Inspect packaged schema and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("quantumd-*.whl"))
          assert len(wheels) == 1, wheels

          wheel = wheels[0]
          schema = (
              "quantumd/schemas/"
              "experiment-v0.1.schema.json"
          )

          with ZipFile(wheel) as archive:
              names = archive.namelist()
              assert schema in names

              metadata_name = next(
                  name
                  for name in names
                  if name.endswith(".dist-info/METADATA")
              )

              metadata = archive.read(
                  metadata_name
              ).decode("utf-8")

          assert "Name: quantumd" in metadata
          assert (
              "License-Expression: Apache-2.0"
              in metadata
          )

          print(f"Wheel:  {wheel}")
          print(f"Schema: {schema}")
          print("Package inspection: PASS")
          PY

      - name: Test clean wheel install and fail-closed execution
        run: |
          WHEEL="$(
            find "$GITHUB_WORKSPACE/dist" \
              -maxdepth 1 \
              -type f \
              -name 'quantumd-*.whl' \
              -print \
              -quit
          )"

          test -n "$WHEEL"

          rm -rf /tmp/quantumd-ci-wheel
          python -m venv /tmp/quantumd-ci-wheel

          /tmp/quantumd-ci-wheel/bin/python \
            -m pip install --upgrade pip

          /tmp/quantumd-ci-wheel/bin/python \
            -m pip install "$WHEEL"

          cd /tmp

          /tmp/quantumd-ci-wheel/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files

          import quantumd

          schema = files("quantumd.schemas").joinpath(
              "experiment-v0.1.schema.json"
          )

          assert schema.is_file()

          print(f"Package: {quantumd.__file__}")
          print(f"Version: {version('quantumd')}")
          print(f"Schema:  {schema}")
          print("Clean installation: PASS")
          PY

          # Ordinary CI intentionally has no KMS signing identity.
          # QuantumD must reject execution rather than silently
          # accepting unsigned verification evidence.
          unset QUANTUMD_KMS_KEY_VERSION
          unset GOOGLE_APPLICATION_CREDENTIALS

          set +e
          DEMO_OUTPUT="$(
            /tmp/quantumd-ci-wheel/bin/quantumd \
              demo --shots 128 2>&1
          )"
          DEMO_STATUS=$?
          set -e

          printf '%s\n' "$DEMO_OUTPUT"

          test "$DEMO_STATUS" -ne 0

          grep -F \
            "Evidence record is not signed." \
            <<< "$DEMO_OUTPUT"

          grep -F \
            "[STATUS] EXECUTION DENIED: AUTHORIZATION_FAILED" \
            <<< "$DEMO_OUTPUT"

          if grep -Fq \
            "EXECUTION COMPLETED AND ATTESTED" \
            <<< "$DEMO_OUTPUT"
          then
            echo "ERROR: Unsigned workload unexpectedly executed."
            exit 1
          fi

          echo "Fail-closed unsigned execution: PASS"

      - name: Upload validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quantumd-distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
