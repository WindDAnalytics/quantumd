[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumd"
version = "0.1.0"
description = "Trust and execution layer for AI-generated quantum software."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "jsonschema>=4.21.1",
    "pyyaml>=6.0.1",
    "qiskit>=1.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "mqt.qcec>=2.5.0",
    "google-cloud-kms>=2.0.0",
    "cryptography>=41.0.0"
]

[project.scripts]
quantumd = "quantumd.cli:cli"
qverify = "quantumd.cli:cli"
