[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumd"
version = "0.7.2a0"
description = "Governed verification, policy enforcement, and evidence-bound execution for quantum software."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "jsonschema>=4.21.1",
    "pyyaml>=6.0.1",
    "qiskit>=1.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "mqt.qcec>=2.5.0",
    "google-cloud-kms>=2.0.0",
    "cryptography>=41.0.0",
    "crcmod>=1.7",
    "google-crc32c>=1.5.0",
    "qiskit-ibm-runtime==0.48.0",
    "google-cloud-secret-manager==2.30.0",
    "qiskit-aer>=0.14.0"
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["quantum computing", "quantum software", "governance", "verification", "reproducibility", "devsecops"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Intended Audience :: Developers", "Intended Audience :: Information Technology", "Intended Audience :: Science/Research", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Topic :: Scientific/Engineering", "Topic :: Security", "Topic :: Software Development :: Quality Assurance", "Topic :: Software Development :: Testing"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
quantumd = "quantumd.cli:cli"
qverify = "quantumd.cli:cli"

[[project.authors]]
name = "Damarcus Thomas"

[project.urls]
Homepage = "https://quantumd.ai"
Documentation = "https://github.com/WindDAnalytics/quantumd#readme"
Repository = "https://github.com/WindDAnalytics/quantumd"
Issues = "https://github.com/WindDAnalytics/quantumd/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"quantumd.schemas" = ["*.json"]
