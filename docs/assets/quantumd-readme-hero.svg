<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="340"
     viewBox="0 0 1200 340"
     role="img"
     aria-labelledby="title description">
  <title id="title">QuantumD governed execution</title>
  <desc id="description">
    QuantumD connects verification, authorization, execution, and independently
    verifiable evidence.
  </desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0d2533"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#55d6ff"/>
      <stop offset="100%" stop-color="#84ffd7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#background)"/>
  <circle cx="1050" cy="35" r="180" fill="#55d6ff" opacity="0.05"/>
  <circle cx="970" cy="320" r="220" fill="#84ffd7" opacity="0.04"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="112" font-size="66" font-weight="700" fill="#ffffff">
      QuantumD
    </text>
    <rect x="72" y="134" width="440" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="186" font-size="27" font-weight="600" fill="#bdeeff">
      Governed execution. Verifiable evidence.
    </text>
    <text x="72" y="229" font-size="20" fill="#d6e4ea">
      Verify what was approved.
    </text>
    <text x="72" y="258" font-size="20" fill="#d6e4ea">
      Prove what actually ran.
    </text>

    <g transform="translate(620,78)">
      <line x1="92" y1="82" x2="218" y2="82"
            stroke="#55d6ff" stroke-width="4"/>
      <line x1="298" y1="82" x2="424" y2="82"
            stroke="#55d6ff" stroke-width="4"/>
      <line x1="504" y1="82" x2="590" y2="82"
            stroke="#84ffd7" stroke-width="4"/>

      <g filter="url(#glow)">
        <circle cx="52" cy="82" r="40" fill="#102c3a"
                stroke="#55d6ff" stroke-width="3"/>
        <circle cx="258" cy="82" r="40" fill="#102c3a"
                stroke="#55d6ff" stroke-width="3"/>
        <circle cx="464" cy="82" r="40" fill="#102c3a"
                stroke="#55d6ff" stroke-width="3"/>
        <circle cx="630" cy="82" r="40" fill="#123b35"
                stroke="#84ffd7" stroke-width="3"/>
      </g>

      <text x="52" y="88" text-anchor="middle" font-size="16"
            font-weight="700" fill="#ffffff">VERIFY</text>
      <text x="258" y="88" text-anchor="middle" font-size="14"
            font-weight="700" fill="#ffffff">AUTHORIZE</text>
      <text x="464" y="88" text-anchor="middle" font-size="15"
            font-weight="700" fill="#ffffff">EXECUTE</text>
      <text x="630" y="88" text-anchor="middle" font-size="16"
            font-weight="700" fill="#ffffff">PROVE</text>

      <text x="52" y="153" text-anchor="middle" font-size="15"
            fill="#b8d0da">Exact workload</text>
      <text x="258" y="153" text-anchor="middle" font-size="15"
            fill="#b8d0da">Bound intent</text>
      <text x="464" y="153" text-anchor="middle" font-size="15"
            fill="#b8d0da">Observed run</text>
      <text x="630" y="153" text-anchor="middle" font-size="15"
            fill="#b8d0da">Evidence chain</text>
    </g>
  </g>
</svg>
